[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mktsk"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["mktsk*"]

[tool.pytest.ini_options]
addopts = "--cov=mktsk --cov-report=term-missing --cov-fail-under=95"

[project.scripts]
mktsk = "mktsk.main:main"
mktsk-gui = "mktsk.gui:main"

[tool.pyright]
pythonPlatform = "All"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "freezegun", "ruff", "pyright", "pytest-qt"]
gui = ["PySide6>=6.10,<7"]

[tool.coverage.run]
branch = true