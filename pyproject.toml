[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mktsk"
version = "0.4.1"
description = "CLI and desktop GUI for quickly setting up task folders."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pedro F." }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/pedro-f-97/mktsk"
Issues = "https://github.com/pedro-f-97/mktsk/issues"

[project.scripts]
mktsk = "mktsk.main:main"
mktsk-gui = "mktsk.gui:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "freezegun", "ruff", "pyright", "pytest-qt"]
gui = ["PySide6>=6.10,<7"]
release = ["build", "twine", "pyinstaller"]

[tool.setuptools.packages.find]
include = ["mktsk*"]

[tool.pytest.ini_options]
addopts = "--cov=mktsk --cov-report=term-missing --cov-fail-under=95"

[tool.pyright]
pythonPlatform = "All"

[tool.coverage.run]
branch = true

[tool.ruff]
# the E3xx blank line rules are still preview, so without this they are selected
# but never run, and ruff warns that the selection has no effect
preview = true

[tool.ruff.lint]
# extend-select alone keeps the 45 default families. Adding a select as well would
# cut them back to E, F and W
# DTZ is listed because preview drops seven of its stable rules, DTZ007 among
# them, which is the one the two noqa comments in standards.py are there for
extend-select = ["W", "E301", "E302", "E303", "E305", "DTZ"]
